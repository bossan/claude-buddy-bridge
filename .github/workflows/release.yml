name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Build
        run: uv build

      - name: Retag wheel as macOS-specific
        run: uvx wheel tags --platform-tag macosx_11_0_universal2 --remove dist/*.whl

      - name: Upload to release
        run: gh release upload ${{ github.ref_name }} dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
