[project]
name = "claude-buddy-bridge"
version = "1.0.0"
description = "BLE bridge and Claude Code hooks for the Claude desk buddy"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sander Bos" }]
dependencies = ["bleak>=0.21", "rumps>=0.4"]

[project.urls]
Repository = "https://github.com/bossan/claude-buddy-bridge"
"Related Project" = "https://github.com/anthropics/claude-desktop-buddy"

[project.scripts]
buddy-bridge = "buddy.bridge:main"
buddy-hook   = "buddy.hook:main"
buddy-app    = "buddy.app:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buddy"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.format]
# defaults (double quotes, 4-space indent)

[tool.pytest.ini_options]
testpaths = ["tests"]
